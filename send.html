<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שליחת SMS אישי | לב חב"ד אסף הרופא</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--burgundy:#600627;--burgundy-dark:#45041c;--orange:#f28c38;--soft:#fff3e8;--bg:#faf6f2;--text:#2a1a1f;--muted:#7a6a6f;--line:#e7dcd6}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Heebo",system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
  .top{background:#fff;text-align:center;padding:12px 16px;border-bottom:4px solid var(--orange)}
  .top img{height:54px}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:22px;margin:4px 0 2px;color:var(--burgundy)}
  .to{color:var(--muted);font-size:15px;margin-bottom:14px}
  .to b{color:var(--text)}
  label{font-size:14px;font-weight:500;display:block;margin-bottom:6px}
  textarea{width:100%;min-height:230px;font:inherit;font-size:15px;line-height:1.6;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--text);resize:vertical}
  textarea:focus{outline:none;border-color:var(--burgundy)}
  .hint{font-size:13px;color:var(--muted);margin:6px 0 16px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border:0;border-radius:12px;font:inherit;font-weight:700;font-size:18px;color:#fff;text-decoration:none;margin-bottom:12px;cursor:pointer}
  .sms{background:var(--burgundy)}
  .done{display:none;background:#e9f7ef;border:1px solid #bfe5cd;color:#1e7d4f;border-radius:12px;padding:12px;text-align:center;font-weight:500;margin-top:6px}
  .done.show{display:block}
  .err{background:var(--soft);border-radius:12px;padding:16px;text-align:center}
</style>
</head>
<body>
<div class="top"><img src="logo.png" alt='לב חב"ד שמיר - אסף הרופא'></div>
<main class="wrap" id="app"></main>

<script>
  // אותה כתובת כמו בטופס הרישום
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfPtCReOZYXbZqq94Vr1HmR2ibyvsCHaz1dyHbZc8GiHHios1BN9cNQdrYdvFGRaiDRg/exec";
  const SITE = "https://shmulikc-arch.github.io/rishum-lina/";
  const RABBI = "הרב מענדי בקרמן";

  const q = new URLSearchParams(location.search);
  const name = (q.get("n") || "").trim();
  const phoneRaw = (q.get("p") || "").trim();
  const email = (q.get("e") || "").trim();
  const digits = phoneRaw.replace(/\D/g, "");
  const app = document.getElementById("app");

  if (!digits) {
    app.innerHTML = '<div class="err">חסר מספר טלפון בקישור. פתחו את הקישור מתוך הגיליון.</div>';
  } else {
    const feedback = SITE + "feedback.html" + (email ? "?e=" + encodeURIComponent(email) : "");
    const msg =
`שלום${name ? " " + name : ""}, כאן ${RABBI} מלב חב"ד אסף הרופא 🙏
שמחנו לארח אתכם בחדרי האירוח, ומאחלים לכם ולכל המשפחה בריאות איתנה ובשורות טובות.

נשמח לשמוע איך היה לכם:
${feedback}

ומי שרוצה להצטרף לשרשרת החסד ולעזור לנו לארח את המשפחה הבאה:
${SITE}donate.html`;

    const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
    app.innerHTML = `
      <h1>SMS אישי</h1>
      <div class="to">אל: <b>${esc(name || "האורח")}</b> · <span dir="ltr">${esc(phoneRaw)}</span></div>
      <label for="msg">ההודעה (אפשר לערוך לפני השליחה)</label>
      <textarea id="msg">${esc(msg)}</textarea>
      <div class="hint">הכפתור פותח את אפליקציית ה-SMS בטלפון שלך, עם המספר וההודעה. נשאר רק ללחוץ "שלח".</div>
      <a class="btn sms" id="smsBtn" href="#">💬 שליחה ב-SMS</a>
      <div class="done" id="done">✔ סומן בגיליון שההודעה נשלחה</div>`;

    const text = () => document.getElementById("msg").value;
    const mark = via => {
      try {
        fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ type: "personalSent", e: email, p: phoneRaw, via }), keepalive: true })
          .then(() => document.getElementById("done").classList.add("show")).catch(() => {});
      } catch (_) {}
    };
    document.getElementById("smsBtn").addEventListener("click", e => {
      e.preventDefault();
      const sep = /iPhone|iPad|iPod/i.test(navigator.userAgent) ? "&" : "?";
      mark("sms");
      location.href = "sms:" + phoneRaw.replace(/[^\d+]/g, "") + sep + "body=" + encodeURIComponent(text());
    });
  }
</script>
</body>
</html>
